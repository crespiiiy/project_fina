<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presenta · باقة الحضور المحلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand-deep:#0f423d;--brand:#124a45;--brand-light:#1f6b63;--gold:#c9a24b;--gold-light:#d8b25c;--bg:#f5f2ea;--ink:#16211f}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Noto Sans Arabic','Noto Sans',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
::selection{background:var(--gold);color:var(--ink)}
.page-wrap{display:none}
.page-wrap.active{display:block;animation:ppIn .5s ease both}
@keyframes ppIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- opening preloader: professional brand intro ---------- */
body.preloader-active{overflow:hidden;overscroll-behavior:none}
.preloader{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#124a45 0%,#0c2b27 70%,#0a2220 100%);opacity:1;transition:opacity .6s ease;overflow:hidden;touch-action:none}
.preloader.leaving{opacity:0}
.preloader::before{content:'';position:absolute;width:540px;height:540px;border-radius:50%;left:50%;top:44%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(201,162,75,.25),rgba(201,162,75,0) 65%);animation:preloaderGlow 3.2s ease-in-out infinite;pointer-events:none}
@keyframes preloaderGlow{0%,100%{opacity:.5}50%{opacity:.95}}
.preloader-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:16px}
.preloader img{display:block;width:136px;max-width:58vw;height:auto;-o-object-fit:contain;object-fit:contain;filter:drop-shadow(0 12px 30px rgba(201,162,75,.35));animation:preloaderPulse 1.9s ease-in-out infinite}
@keyframes preloaderPulse{0%,100%{opacity:.82;transform:scale(1)}50%{opacity:1;transform:scale(1.035)}}
.preloader-word{font-weight:800;letter-spacing:9px;font-size:15px;color:var(--gold);text-indent:9px;opacity:0;animation:preloaderWord 1s ease .2s forwards}
@keyframes preloaderWord{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.preloader-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08)}
.preloader-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-light),var(--gold));box-shadow:0 0 12px rgba(201,162,75,.6);animation:preloaderLoad 1.5s ease .2s forwards}
@keyframes preloaderLoad{to{width:100%}}
@media (max-width:480px){.preloader img{width:118px}.preloader-word{font-size:13px;letter-spacing:7px}}
@media (prefers-reduced-motion:reduce){.preloader::before{animation:none}.preloader img{animation:none;opacity:1}.preloader-word{opacity:1;animation:none}.preloader-bar i{animation-duration:.3s}}

/* ---------- sticky site header ---------- */
.site-header{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.85);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid rgba(15,66,61,.1)}
.hd-inner{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hd-brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:5px;font-size:14px;color:var(--brand-deep)}
.hd-brand::before{content:'';width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--gold-light),var(--gold))}
.hd-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hd-btn{font-family:inherit;font-size:14px;border-radius:999px;padding:9px 18px;cursor:pointer;border:1px solid rgba(15,66,61,.18);background:#fff;color:var(--ink);font-weight:700;display:inline-flex;align-items:center;gap:8px;line-height:1.2;box-shadow:0 2px 8px rgba(15,66,61,.06);transition:transform .15s,box-shadow .15s,border-color .15s}
.hd-btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(15,66,61,.12)}
.lang-btn{background:linear-gradient(135deg,var(--gold-light),var(--gold));border-color:var(--gold);color:#16211f;box-shadow:0 4px 14px rgba(201,162,75,.35)}
.country-wrap{position:relative}
.country-menu{position:absolute;top:calc(100% + 10px);inset-inline-end:0;min-width:210px;background:#fff;border:1px solid rgba(15,66,61,.12);border-radius:14px;box-shadow:0 16px 40px rgba(15,66,61,.18);overflow:hidden;z-index:70;padding:6px;animation:menuIn .18s ease both}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.country-menu[hidden]{display:none}
.c-item{display:flex;align-items:center;gap:10px;width:100%;text-align:start;font-family:inherit;font-size:14px;font-weight:700;padding:10px 12px;border:0;background:transparent;cursor:pointer;border-radius:10px;color:var(--ink);transition:background .15s}
.c-item:hover{background:#f0f7f4}
.c-item.sel{background:linear-gradient(135deg,#e9f3f0,#f4faf7);color:var(--brand-deep)}
.c-item.sel::after{content:'✓';margin-inline-start:auto;color:var(--gold);font-weight:800}
.c-item .c-en{font-size:11px;font-weight:600;color:#6a7a77;display:block;letter-spacing:.5px}

/* ---------- gate screen ---------- */
.gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 50% -10%,#1f6b63 0%,#124a45 55%,#0f423d 100%);color:#fff;text-align:center;overflow:hidden}
.gate::before,.gate::after{content:'';position:absolute;border-radius:50%;filter:blur(60px);opacity:.22;pointer-events:none}
.gate::before{width:420px;height:420px;background:#c9a24b;top:-140px;inset-inline-end:-100px;animation:float1 9s ease-in-out infinite}
.gate::after{width:340px;height:340px;background:#7fd1c6;bottom:-120px;inset-inline-start:-90px;animation:float2 11s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translateY(0)}50%{transform:translateY(26px)}}
@keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
.gate[hidden]{display:none}
.gate-inner{max-width:680px;width:100%;position:relative;animation:gateIn .6s ease both}
@keyframes gateIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.gate-brand{display:inline-flex;align-items:center;gap:10px;letter-spacing:6px;font-weight:800;font-size:14px;opacity:.92;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);padding:6px 16px;border-radius:999px}
.gate-brand::before{content:'';width:9px;height:9px;border-radius:3px;background:var(--gold)}
.gate-title{font-size:36px;margin:22px 0 8px;font-weight:800;line-height:1.3}
.gate-title-en{display:block;font-size:18px;font-weight:600;opacity:.88;margin-top:10px}
.gate-sub{opacity:.94;margin:0 auto 30px;max-width:520px;font-size:15.5px;line-height:1.7}
.gate-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.gate-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 16px;background:rgba(255,255,255,.97);border-radius:20px;border:2px solid transparent;cursor:pointer;font-family:inherit;font-size:21px;font-weight:800;color:var(--brand-deep);box-shadow:0 10px 26px rgba(0,0,0,.2);transition:transform .18s,box-shadow .18s,border-color .18s;animation:gateBtn .5s ease both}
.gate-btn:nth-child(2){animation-delay:.07s}
.gate-btn:nth-child(3){animation-delay:.14s}
.gate-btn:nth-child(4){animation-delay:.21s}
@keyframes gateBtn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.gate-btn:hover,.gate-btn:focus-visible{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 18px 36px rgba(0,0,0,.28)}
.gate-btn .g-en{font-size:13px;font-weight:600;color:#5a6a67;letter-spacing:1px}
.gate-note{margin-top:28px;font-size:12.5px;opacity:.8}
.noscript-note{padding:24px;text-align:center;color:#8e2430;font-weight:700}
@media (max-width:560px){.gate-grid{grid-template-columns:1fr}.gate-title{font-size:28px}}


/* ---------- sales pages: modern design ---------- */
.pp{margin:0;font-family:'Noto Sans Arabic','Noto Sans',sans-serif;background:linear-gradient(180deg,#f7f4ed 0%,#f2ede3 100%);color:#16211f;line-height:1.75;min-height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pp *{box-sizing:border-box}
.pp header{position:relative;overflow:visible;background:linear-gradient(135deg,#0f423d 0%,#124a45 45%,#1f6b63 100%);color:#fff;padding:60px 20px 70px;text-align:center}
html,body{overflow-x:hidden;overflow-y:auto;height:100%}
.pp header::before,.pp header::after{content:'';position:absolute;border-radius:50%;filter:blur(10px);pointer-events:none}
.pp header::before{width:300px;height:300px;top:-130px;inset-inline-end:-70px;background:#c9a24b;opacity:.16}
.pp header::after{width:220px;height:220px;bottom:-110px;inset-inline-start:-60px;background:#8fd8cb;opacity:.18}
.pp header h1{margin:0 0 12px;font-size:44px;font-weight:800;position:relative;line-height:1.25}
.pp header p{margin:0 auto;max-width:650px;opacity:.95;position:relative;font-size:16.5px}
.pp .logo{height:92px;border-radius:18px;margin-bottom:14px;display:block;margin-inline:auto;box-shadow:0 14px 30px rgba(0,0,0,.25);position:relative}
.pp .brand{letter-spacing:6px;font-weight:800;font-size:13px;opacity:.85;position:relative}
.pp .btn{display:inline-block;margin-top:24px;background:linear-gradient(135deg,#d8b25c,#c9a24b);color:#16211f;padding:15px 34px;border-radius:999px;font-weight:800;text-decoration:none;box-shadow:0 12px 28px rgba(201,162,75,.4);transition:transform .18s,box-shadow .18s;position:relative}
.pp .btn:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(201,162,75,.5)}
.pp main{max-width:1080px;margin:0 auto;padding:30px 16px 10px}
.pp section{margin:36px 0}
.pp h2{color:#0f423d;font-size:27px;font-weight:800;border-bottom:3px solid var(--gold);display:inline-block;padding-bottom:8px;line-height:1.35}
.pp .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.pp .card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 4px 16px rgba(15,66,61,.08);border:1px solid rgba(15,66,61,.07);transition:transform .18s,box-shadow .18s;position:relative}
.pp .card:hover{transform:translateY(-5px);box-shadow:0 16px 36px rgba(15,66,61,.14)}
.pp .card h3{margin:8px 0 10px;font-size:17px;color:#0f423d;font-weight:800}
.pp .card[data-tier] h3{font-size:21px}
.pp .card[data-tier='clear']{border:2px solid var(--gold);box-shadow:0 14px 34px rgba(201,162,75,.2)}
.pp .tier-badge{position:absolute;top:-14px;inset-inline-center:0;background:linear-gradient(135deg,#d8b25c,#c9a24b);color:#16211f;font-size:12.5px;font-weight:800;padding:5px 16px;border-radius:999px;letter-spacing:.5px;box-shadow:0 8px 18px rgba(201,162,75,.4);white-space:nowrap}
.pp .price{font-size:25px;font-weight:800;color:#0f423d;margin:8px 0}
.pp .price small{font-size:11px;font-weight:600;color:#8a5a00}
.pp .trial{color:#8e2430;font-weight:800;margin:0;background:#fdf0f1;border-radius:10px;padding:9px 13px;display:inline-block}
.pp .meta{font-size:12.5px;color:#5a6a67;background:#f5f8f6;border:1px solid rgba(15,66,61,.07);border-radius:10px;padding:10px 13px;margin:9px 0}
.pp li{margin:5px 0}
.pp .note{background:#fff8e6;border-inline-start:4px solid var(--gold);padding:15px 17px;border-radius:14px;font-size:14.5px}
.pp .demo{display:inline-block;background:#eef;border:1px dashed #557;font-size:12px;padding:2px 8px}

/* illustrative example section: realistic gallery */
.pp .demo-lead{max-width:820px;margin:0 auto 24px;color:#45564f;font-size:15.5px;text-align:center}
.pp .demo-gallery{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.pp .demo-fig{margin:0;background:#fff;border:1px solid rgba(15,66,61,.08);border-radius:18px;overflow:hidden;box-shadow:0 6px 20px rgba(15,66,61,.09);transition:transform .18s,box-shadow .18s}
.pp .demo-fig:hover{transform:translateY(-5px);box-shadow:0 14px 32px rgba(15,66,61,.16)}
.pp .demo-fig img{width:100%;height:200px;object-fit:cover;display:block;background:#eef0ec}
.pp .demo-fig figcaption{padding:10px 12px;font-size:13px;font-weight:700;color:#0f423d;text-align:center}
.pp .qr-box{height:200px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f4f6f5,#e9f0ee);border-radius:14px;padding:14px;box-shadow:inset 0 0 0 1px rgba(15,66,61,.08)}
.pp .qr-svg{display:block;border-radius:12px;box-shadow:0 10px 24px rgba(15,66,61,.18)}

/* CTA section: free audit card */
.pp .cta-card{display:flex;align-items:center;gap:22px;background:linear-gradient(135deg,#0f423d,#1f6b63);border-radius:22px;padding:30px 26px;color:#fff;box-shadow:0 16px 40px rgba(15,66,61,.28);flex-wrap:wrap;justify-content:center;text-align:center;margin-top:8px}
.pp .cta-icon{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.pp .cta-body{display:flex;flex-direction:column;gap:16px;align-items:center}
.pp .cta-line{margin:0;font-size:17px}
.pp .cta-num{font-size:21px;margin:0;display:none;animation:ctaFade .35s ease}
.pp .cta-num.show{display:inline-block}
@keyframes ctaFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pp .cta-btn{display:inline-block;background:linear-gradient(135deg,#d8b25c,#c9a24b);color:#16211f;padding:14px 32px;border-radius:999px;font-weight:800;text-decoration:none;box-shadow:0 10px 24px rgba(201,162,75,.4);transition:transform .18s,box-shadow .18s;font-size:16px;letter-spacing:.5px}
.pp .cta-btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(201,162,75,.5)}
.pp .sticky{position:static;bottom:0;left:0;right:0;background:#124a45;text-align:center;padding:10px}
.pp .sticky a{color:#fff;font-weight:bold;text-decoration:none}
.pp footer{text-align:center;color:#7d8a87;font-size:12.5px;padding:28px 20px 26px;border-top:1px solid rgba(15,66,61,.1);margin-top:34px}
.pp footer a{color:var(--gold);text-decoration:none;font-weight:700;transition:color .15s}
.pp footer a:hover{color:var(--gold-light);text-decoration:underline}
@media (max-width:980px){.pp .demo-gallery{grid-template-columns:1fr 1fr 1fr}}
@media (max-width:680px){.pp .demo-gallery{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.pp .demo-gallery{grid-template-columns:1fr}.pp .demo-fig img{height:180px}.pp .cta-card{padding:24px 18px}}
@media (max-width:720px){
.pp header{padding:34px 16px 44px}
.pp header h1{font-size:30px}
.pp .grid{grid-template-columns:1fr}
.pp .card{padding:18px}
.pp h2{font-size:23px}
}

/* ---------- launch offer: discount code feature ---------- */
.pp .launch-line{font-size:12.5px;color:#8a5a00;font-weight:800;margin:6px 0 4px;text-align:center}
.pp .launch-remain{font-size:12.5px;color:#0f423d;font-weight:800;margin:0 0 10px;text-align:center}
.pp .launch-open{width:100%;background:linear-gradient(135deg,#d8b25c,#c9a24b);color:#16211f;border:0;padding:12px;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;box-shadow:0 6px 16px rgba(201,162,75,.3);transition:transform .15s,box-shadow .15s}
.pp .launch-open:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(201,162,75,.4)}
.pp .launch-form{display:flex;flex-direction:column;gap:10px;margin-top:12px;padding:16px;background:#fff;border:1px solid rgba(15,66,61,.08);border-radius:14px;box-shadow:0 8px 24px rgba(15,66,61,.1);animation:launchSlide .3s ease both}
@keyframes launchSlide{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.pp .launch-form input{padding:10px 12px;border:1px solid rgba(15,66,61,.15);border-radius:10px;font-size:14px;font-family:inherit;width:100%;box-sizing:border-box}
.pp .launch-form input:focus{outline:none;border-color:var(--gold)}
.pp .launch-form .launch-submit{background:var(--brand-deep);color:#fff;border:0;padding:12px;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer;margin-top:4px}
.pp .launch-form .launch-submit:hover{background:#0c2b27}
.pp .launch-form .launch-close{background:transparent;color:#5a6a67;border:0;padding:10px;border-radius:10px;font-size:14px;cursor:pointer;text-align:left;width:100%}
.pp .launch-form .launch-close:hover{background:#f5f2ea}
.pp .launch-result{margin-top:10px;padding:12px;border-radius:10px;font-size:14px;font-weight:700;text-align:center;display:none}
.pp .launch-result.show{display:block}
.pp .launch-result.valid{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7}
.pp .launch-result.invalid{background:#fdf0f1;color:#8e2430;border:1px solid #f8bbc0}
/* ---------- launch offer banner: professional strip above each package ---------- */
.pp .launch-banner{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#fdf3dc,#f7e8c7);border:1px solid var(--gold);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;font-weight:800;color:#6d4a00;box-shadow:0 4px 12px rgba(201,162,75,.12);animation:launchBannerPulse 2.5s ease-in-out infinite}
@keyframes launchBannerPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.92;transform:scale(1.01)}}
.pp .launch-code-badge{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#16211f;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:900;letter-spacing:.5px;box-shadow:0 2px 6px rgba(201,162,75,.35)}
.pp .launch-banner-text{font-size:12.5px;line-height:1.4}
.pp .launch-banner .emoji{font-size:16px}
/* ---------- mobile enhancements: professional & modern ---------- */
@media (max-width:768px){
  .pp header{padding:40px 16px 50px}
  .pp header h1{font-size:32px}
  .pp header p{font-size:15px}
  .pp main{padding:20px 14px 10px}
  .pp .grid{grid-template-columns:1fr;gap:14px}
  .pp .card{padding:18px 16px;border-radius:16px}
  .pp .card[data-tier] h3{font-size:20px}
  .pp .price{font-size:22px}
  .pp h2{font-size:22px;margin:24px 0 14px}
  .pp section{margin:28px 0}
  .pp .tier-badge{top:-12px;font-size:11px;padding:4px 12px}
  .pp .cta-card{flex-direction:column;gap:14px;padding:24px 20px}
  .pp .cta-body{align-items:flex-start;text-align:left}
  .pp .cta-line{font-size:16px}
  .pp footer{padding:24px 16px 20px}
}
@media (max-width:480px){
  /* safe area for notch phones */
  .pp main{padding-left:max(14px, env(safe-area-inset-left));padding-right:max(14px, env(safe-area-inset-right));padding-bottom:max(20px, env(safe-area-inset-bottom))}
  .pp header{padding:36px env(safe-area-inset-left) 48px env(safe-area-inset-right)}
  .pp .launch-banner{flex-direction:column;align-items:flex-start;gap:8px;padding:12px 14px;font-size:12px}
  .pp .launch-code-badge{padding:4px 10px;font-size:11px}
  .pp .launch-banner .emoji{font-size:14px}
  .pp .launch-banner-text{font-size:12px;line-height:1.4}
  .pp .launch-open{padding:14px 16px;font-size:15px;border-radius:14px}
  .pp .launch-form{padding:16px;border-radius:16px;gap:12px}
  .pp .launch-form input{padding:14px 14px;font-size:16px;border-radius:12px}
  .pp .launch-form .launch-submit{padding:14px;font-size:16px;border-radius:12px}
  .pp .launch-form .launch-close{padding:12px;font-size:14px;border-radius:12px}
  .pp .launch-result{padding:14px;font-size:14px;border-radius:12px}
  .pp .launch-line{font-size:12px}
  .pp .launch-remain{font-size:12px}
  .pp .demo-gallery{grid-template-columns:1fr;gap:12px}
  .pp .demo-fig img{height:150px}
  .pp .cta-card{padding:22px 18px}
  .pp .cta-btn{width:100%;text-align:center;font-size:16px;padding:14px}
  .pp .gate{padding:16px}
  .pp .gate-title{font-size:26px}
  .pp .gate-btn{padding:22px 14px;font-size:19px}
  .site-header{padding:8px 12px}
  .hd-brand{font-size:13px;letter-spacing:3px}
  .hd-btn{padding:8px 14px;font-size:13px}
  .lang-btn{padding:8px 12px;font-size:13px}
}
@media (max-width:480px) and (orientation:landscape){
  .pp header{padding:24px 16px 32px}
  .pp header h1{font-size:26px}
}
</style>
</head>

<!-- ===== Opening preloader: brand logo on first load ===== -->

var WRAP_IDS={eg:'page-eg',qa:'page-qa',ae:'page-ae',int:'page-int'};

function $(id){return document.getElementById(id);}
function save(){
 try{
  localStorage.setItem(STORE_M, state.market||'');
  localStorage.setItem(STORE_L, state.lang||'ar');
 }catch(e){}
}
function loadState(){
 try{
  var m=localStorage.getItem(STORE_M), l=localStorage.getItem(STORE_L);
  if(l==='en'||l==='ar') state.lang=l;
  if(m&&COUNTRIES.some(function(c){return c.id===m;})) state.market=m;
 }catch(e){}
}
function countryOf(id){for(var i=0;i<COUNTRIES.length;i++){if(COUNTRIES[i].id===id)return COUNTRIES[i];}return null;}
function titleText(){return state.lang==='ar'?'باقة الحضور المحلي':'Local Presence Kit';}

function renderPage(){
 var wrap=$(WRAP_IDS[state.market]);
 if(!wrap) return;
 wrap.innerHTML=PAGES[state.market][state.lang].split('__LOGO__').join(LOGO);
 var pp=wrap.querySelector('.pp');
 if(pp){
  pp.setAttribute('dir', state.lang==='ar'?'rtl':'ltr');
  pp.setAttribute('lang', state.lang);
  pp.setAttribute('data-lang', state.lang);
 }
 var root=document.documentElement;
 root.setAttribute('dir', state.lang==='ar'?'rtl':'ltr');
 root.setAttribute('lang', state.lang);
 document.title='Presenta · '+titleText()+' · '+(countryOf(state.market)?(state.lang==='ar'?countryOf(state.market).ar:countryOf(state.market).en):'');
}
function showMarket(id){
 state.market=id; save();
 var h='#'+M_TO_HASH[id];
 if(location.hash!==h){ history.replaceState(null,'',location.pathname+location.search+h); }
 for(var k in WRAP_IDS){
  var w=$(WRAP_IDS[k]);
  if(w) w.className='page-wrap'+(k===id?' active':'');
 }
 renderPage(); updateHeader();
 $('site-header').hidden=false;
 $('gate').hidden=true;
 window.scrollTo(0,0);
}
function setLang(l){
 state.lang=l; save(); renderPage(); updateHeader();
}
function updateHeader(){
 var c=countryOf(state.market);
 if(!c){ $('site-header').hidden=true; return; }
 $('site-header').hidden=false;
 $('countryFlag').textContent=c.flag;
 $('countryName').textContent=state.lang==='ar'?c.ar:c.en;
 $('langLabel').textContent=state.lang==='ar'?'English':'العربية';
 var items=document.querySelectorAll('.c-item');
 for(var i=0;i<items.length;i++){
  items[i].classList.toggle('sel', items[i].getAttribute('data-market')===state.market);
 }
}
function applyInitial(){
 var h=(location.hash||'').toLowerCase();
 if(HASH_TO_M[h]){ state.market=HASH_TO_M[h]; }
 loadState();
 if(state.market){
  showMarket(state.market);
 }else{
  $('site-header').hidden=true;
  $('gate').hidden=false;
  document.title='Presenta · '+titleText();
 }
}
window.addEventListener('hashchange',function(){
 var h=(location.hash||'').toLowerCase();
 if(HASH_TO_M[h]&&HASH_TO_M[h]!==state.market){ showMarket(HASH_TO_M[h]); }
});
/* gate buttons */
var gateGrid=$('gate-grid');
if(gateGrid){
 gateGrid.addEventListener('click',function(e){
  var b=e.target.closest('.gate-btn');
  if(b&&b.getAttribute('data-market')){ showMarket(b.getAttribute('data-market')); }
 });
}
/* country menu */
var cBtn=$('countryBtn'), cMenu=$('countryMenu');
if(cBtn&&cMenu){
 cBtn.addEventListener('click',function(e){
  e.stopPropagation();
  var open=!cMenu.hidden;
  cMenu.hidden=open;
  cBtn.setAttribute('aria-expanded', String(!open));
 });
 document.addEventListener('click',function(e){
  if(!cMenu.hidden&&!cMenu.contains(e.target)&&e.target!==cBtn){
   cMenu.hidden=true; cBtn.setAttribute('aria-expanded','false');
  }
 });
 cMenu.addEventListener('click',function(e){
  var it=e.target.closest('.c-item');
  if(it&&it.getAttribute('data-market')){
   cMenu.hidden=true; cBtn.setAttribute('aria-expanded','false');
   showMarket(it.getAttribute('data-market'));
  }
 });
}
/* language toggle */
var langBtn=$('langBtn');
if(langBtn){
 langBtn.addEventListener('click',function(){
  setLang(state.lang==='ar'?'en':'ar');
 });
}
/* CTA contact button: reveal the number and open WhatsApp immediately */
document.addEventListener('click',function(e){
 var btn=e.target.closest('.cta-btn');
 if(!btn) return;
 var card=btn.closest('.cta-card');
 if(card){
  var num=card.querySelector('.cta-num');
  if(num){ num.hidden=false; num.classList.add('show'); }
 }
 var href=btn.getAttribute('href');
 if(href){
  var w=window.open(href,'_blank','noopener');
  if(!w){ location.href=href; }
 }
});

/* ---------- Launch offer: discount code feature ---------- */
var LAUNCH_CONFIG = {
  apiEndpoint: 'https://pres-enta.vercel.app/api/launch',
  demoMode: false     // true = localStorage counter (testing only); false = server-side via apiEndpoint
};

function launchStoreKey(tier, market) {
  return 'presenta.launch.' + tier + '.' + market;
}

function launchGetRemaining(tier, market) {
  if (LAUNCH_CONFIG.demoMode) {
    try {
      var used = parseInt(localStorage.getItem(launchStoreKey(tier, market)) || '0', 10);
      return Math.max(0, LAUNCH_LIMIT - used);
    } catch (e) { return LAUNCH_LIMIT; }
  }
  return LAUNCH_LIMIT;
}

function launchShowResult(formId, ok, msg, cls) {
  var el = document.getElementById(formId.replace('launch-form-', 'launch-result-'));
  if (!el) return;
  el.textContent = msg;
  el.className = 'launch-result ' + (cls || '');
  el.hidden = false;
  el.classList.add('show');
}

function launchSubmit(form) {
  var fd = new FormData(form);
  var data = {
    name: fd.get('name'),
    phone: fd.get('phone'),
    code: fd.get('code'),
    tier: fd.get('tier'),
    market: fd.get('market'),
    lang: state.lang,
    time: new Date().toISOString()
  };
  var submitBtn = form.querySelector('.launch-submit');
  var origTxt = submitBtn.textContent;
  submitBtn.textContent = state.lang === 'ar' ? '\u062c\u0627\u0631\u064a \u0627\u0644\u0625\u0631\u0633\u0627\u0644...' : 'Sending...';
  submitBtn.disabled = true;

  if (LAUNCH_CONFIG.demoMode) {
    setTimeout(function() {
      var codeOk = data.code === LAUNCH_CODES[data.tier];
      var remaining = launchGetRemaining(data.tier, data.market);
      if (!codeOk) {
        launchShowResult('launch-form-' + data.tier + '-' + data.market, false,
          state.lang === 'ar' ? '\u0639\u0630\u0631\u0627\u064b\u060c \u0643\u0648\u062f \u0627\u0644\u062e\u0635\u0645 \u063a\u064a\u0631 \u0635\u062d\u064a\u062d \u0623\u0648 \u0646\u0647 \u063a\u064a\u0631 \u0635\u0627\u0644\u062d \u0644\u0647\u0630\u0627 \u0627\u0644\u0628\u0627\u0642\u0629\u060c' : 'Sorry, the discount code is invalid or not applicable to this package.', 'invalid');
      } else if (remaining <= 0) {
        launchShowResult('launch-form-' + data.tier + '-' + data.market, false,
          state.lang === 'ar' ? '\u0639\u0631\u0636 \u0627\u0644\u0625\u0637\u0644\u0627\u0642 \u0639\u0644\u0649 \u0627\u0644\u0628\u0627\u0642\u0629 \u062f\u064a \u062e\u0644\u0635\u060c \u0644\u0643\u0646 \u0647\u0646\u062a\u0648\u0627\u0635\u0644 \u0645\u0639\u0627\u0643 \u0628\u0627\u0644\u0633\u0639\u0631 \u0627\u0644\u062f\u0627\u0626\u064a.' : 'The launch offer for this package is sold out, but we\'ll contact you at the regular price.', 'invalid');
      } else {
        try {
          localStorage.setItem(launchStoreKey(data.tier, data.market),
            (parseInt(localStorage.getItem(launchStoreKey(data.tier, data.market)) || '0', 10) + 1).toString());
        } catch (e) {}
        var reg = REGULAR_NUM_FOR_JS[data.market][TIER_ORDER_FOR_JS.indexOf(data.tier)];
        var disc = Math.round(reg * (1 - LAUNCH_PCT / 100));
        var pct = Math.round((1 - disc / reg) * 100);
        var cur = CURRENCY_FOR_JS[data.market][state.lang];
        var msg = (state.lang === 'ar'
          ? '\u0645\u0628\u0631\u0648\u0643\u060c \u062d\u0635\u0644\u062a \u0639\u0644\u0649 \u062e\u0635\u0645 \u0627\u0644\u0625\u0637\u0644\u0627\u0642 ' + pct + '%\u060c \u0648\u0627\u0644\u0633\u0639\u0631 \u0628\u0639\u062f \u0627\u0644\u062e\u0635\u0645 ' + disc + ' ' + cur + '\u060c \u0648\u0647\u0646\u062a\u0648\u0627\u0635\u0644 \u0645\u0639\u0627\u0643 \u0642\u0631\u064a\u0628\u0629.'
          : 'Congratulations! You got the launch offer: ' + pct + '% off. Price after discount: ' + disc + ' ' + cur + '. We\'ll contact you soon.');
        launchShowResult('launch-form-' + data.tier + '-' + data.market, true, msg, 'valid');
      }
      submitBtn.textContent = origTxt;
      submitBtn.disabled = false;
    }, 800);
    return;
  }

  if (!LAUNCH_CONFIG.apiEndpoint) {
    launchShowResult('launch-form-' + data.tier + '-' + data.market, false,
      'Server endpoint not configured. Please set LAUNCH_CONFIG.apiEndpoint.', 'invalid');
    submitBtn.textContent = origTxt;
    submitBtn.disabled = false;
    return;
  }
  fetch(LAUNCH_CONFIG.apiEndpoint, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  }).then(function(r) { return r.json(); }).then(function(res) {
    var cls = res.valid ? 'valid' : 'invalid';
    launchShowResult('launch-form-' + data.tier + '-' + data.market, res.valid, res.message || '', cls);
    submitBtn.textContent = origTxt;
    submitBtn.disabled = false;
  }).catch(function() {
    launchShowResult('launch-form-' + data.tier + '-' + data.market, false,
      state.lang === 'ar' ? '\u062d\u062f\u062b \u0627\u0644\u0627\u0637\u0627\u0631 \u0641\u064a \u0627\u0644\u0625\u0631\u0633\u0627\u0644\u060c \u062d\u0627\u0648\u0644 \u0645\u0631\u0629 \u0623\u062e\u0631\u0649\u060c' : 'Send error, please try again later.', 'invalid');
    submitBtn.textContent = origTxt;
    submitBtn.disabled = false;
  });
}

document.addEventListener('click', function(e) {
  var open = e.target.closest('.launch-open');
  if (open) {
    var tier = open.getAttribute('data-tier');
    var market = open.getAttribute('data-market');
    var form = document.getElementById('launch-form-' + tier + '-' + market);
    if (form) {
      open.hidden = true;
      form.hidden = false;
      var remEl = document.getElementById('launch-remain-' + tier + '-' + market);
      if (remEl) {
        var remaining = launchGetRemaining(tier, market);
        remEl.textContent = state.lang === 'ar' ? '\u0628\u0627\u0642\u064a ' + remaining + ' \u0639\u0645\u064a\u0644 \u0644\u0647\u0630\u0627 \u0627\u0644\u0639\u0631\u0636' : remaining + ' customers left for this offer';
      }
    }
    return;
  }
  var close = e.target.closest('.launch-close');
  if (close) {
    var form = close.closest('.launch-form');
    if (form) {
      var tierEl = form.querySelector("input[name='tier']");
      var marketEl = form.querySelector("input[name='market']");
      var tier = tierEl ? tierEl.value : '';
      var market = marketEl ? marketEl.value : '';
      var openBtn = document.querySelector(".launch-open[data-tier='" + tier + "'][data-market='" + market + "']");
      if (openBtn) openBtn.hidden = false;
      form.hidden = true;
      var res = document.getElementById('launch-result-' + tier + '-' + market);
      if (res) { res.hidden = true; res.classList.remove('show'); res.textContent = ''; }
    }
    return;
  }
  var submitBtn = e.target.closest('.launch-submit');
  if (submitBtn) {
    e.preventDefault();
    var form = submitBtn.closest('.launch-form');
    if (form) launchSubmit(form);
  }
});
applyInitial();
})();
</script>
</body>
</html>
